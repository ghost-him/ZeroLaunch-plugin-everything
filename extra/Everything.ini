; ZeroLaunch Everything 插件随包实例预置配置。
; 仅供插件安装根的 everything.exe（裸机兜底）读取；用户自装版走自己的 ini，本文件绝不触碰。
; Everything 启动时若同目录有 ini 且 app_data=0 即用它（便携语义），缺失键自动补默认值，
; 退出时回写完整版（保留此处的 0 值）。运行时改动会被退出回写覆盖，属官方语义，非 bug。
[Everything]
; 数据与配置存同目录（插件安装根），不写 %APPDATA%，与用户安装版彻底隔离。
app_data=0
; 本体缺失拉起后关闭全部搜索窗口时不退出，常驻响应 SDK 查询。
run_in_background=1
; 由插件拉起的随包实例不在系统托盘展示图标（无感运行；任务管理器可见进程）。
; 用户自装版的图标由其自身配置决定，插件无权干预。
show_tray_icon=0
