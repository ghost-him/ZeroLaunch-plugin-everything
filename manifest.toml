[plugin]
id = "com.ghost-him.everything"
name = "Everything 搜索"
version = "0.1.0"
description = "Everything 文件搜索集成：触发词 ev / every 后输入查询，Enter 打开文件，路径匹配开关在结果动作中"
author = "ghost-him"
minHostVersion = "0.1.0"

[runtime]
command = "bin/zerolaunch-plugin-everything.exe"
args = []
startupTimeout = 10
autoRestart = true
maxRestart = 3

[components]
provides = ["plugin"]

[ui]
panelEntry = "ui/panel.mjs"
