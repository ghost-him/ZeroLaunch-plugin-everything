[package]
name = "zerolaunch-plugin-everything"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
zerolaunch-plugin-sdk-rust = "0.2"
zerolaunch-plugin-api = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
blake3 = "1.8"
parking_lot = "0.12"

# Everything SDK 绑定仅支持 Windows x86_64（Everything 服务本身亦仅提供 64 位 SDK DLL）。
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
everything-rs = "0.1.10"
everything-sys-bindgen = "0.1.5"

# 右键菜单的「用记事本打开 / 打开文件位置 / 复制路径」由插件进程直接完成：
# 宿主协议未暴露剪贴板与任意程序启动能力（新增宿主方法需协议 + SDK 发版），
# 这三项属于纯平台调用，放插件侧即可。仅 Windows 需要。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

# 独立于父 workspace（插件为独立分发包，不参与宿主 workspace 构建）
[workspace]
